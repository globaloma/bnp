name: Supabase keepalive

# Supabase pauses free-tier projects after a period of no activity.
# This pings the project's REST API 4x/day so it stays awake.
on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {} # lets us trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/keepalive.mjs
